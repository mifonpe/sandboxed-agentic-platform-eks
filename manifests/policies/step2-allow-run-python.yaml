# Step 2 — allow exactly one tool, still with no identity check.
#
# Everything not named here stays denied by the same semantics as step 1. When
# Cognito lands, this expression gains a claim check:
#   'mcp.tool.name == "run_python" && "data-analyst" in jwt["cognito:groups"]'
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-tool-authz
  namespace: ${namespace}
spec:
  targetRefs:
    - kind: AgentgatewayBackend
      name: mcp-sandbox
      group: agentgateway.dev
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - 'mcp.tool.name == "run_python"'
