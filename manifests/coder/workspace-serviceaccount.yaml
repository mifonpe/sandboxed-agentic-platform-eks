# ServiceAccount for Coder workspace pods.
#
# Separate from "default" on purpose: the Pod Identity association that grants
# Bedrock binds to this name, and binding it to default would hand Bedrock to
# every pod in the namespace — the Coder server and its database included.
#
# Workspace templates must set serviceAccountName to this, or the pod gets no
# credentials and Claude Code falls back to whatever the SDK finds (usually
# nothing).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-workspace
  namespace: ${namespace}
