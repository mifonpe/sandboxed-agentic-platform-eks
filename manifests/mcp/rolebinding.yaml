apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-sandbox-claims
  namespace: ${sandbox_namespace}
subjects:
  - kind: ServiceAccount
    name: mcp-sandbox
    namespace: ${namespace}
roleRef:
  kind: Role
  name: mcp-sandbox-claims
  apiGroup: rbac.authorization.k8s.io
