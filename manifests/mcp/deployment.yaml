# MCP server exposing run_python as a tool. Sits behind agentgateway, which does
# JWT authn and per-tool authz before anything reaches here — this process makes
# no authorization decision. It creates one SandboxClaim per call, proxies code
# into the resulting microVM through the sandbox-router, and deletes the claim.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-sandbox
  namespace: ${namespace}
  labels:
    app: mcp-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-sandbox
  template:
    metadata:
      labels:
        app: mcp-sandbox
    spec:
      serviceAccountName: mcp-sandbox
      containers:
        - name: server
          image: ${image}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SANDBOX_NAMESPACE
              value: ${sandbox_namespace}
            - name: SANDBOX_WARMPOOL
              value: ${warmpool}
            - name: SANDBOX_ROUTER_URL
              value: http://sandbox-router-svc.agent-sandbox-system.svc.cluster.local:8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            # /healthz, not /mcp: the MCP endpoint requires
            # `Accept: text/event-stream` and answers a plain GET with 406.
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
